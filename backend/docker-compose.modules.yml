services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas
    ports:
      - "55432:5432"
    volumes:
      - saas_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - saas-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: user
    image: saas-user:latest
    environment:
      MODULE: user
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/saas?sslmode=disable
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":9091"
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - saas-network

  note-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: note
    image: saas-note:latest
    environment:
      MODULE: note
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/saas?sslmode=disable
      HTTP_ADDR: ":8082"
      GRPC_ADDR: ":9092"
    ports:
      - "8082:8082"
      - "9092:9092"
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - saas-network

  task-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: task
    image: saas-task:latest
    environment:
      MODULE: task
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/saas?sslmode=disable
      HTTP_ADDR: ":8083"
      GRPC_ADDR: ":9093"
    ports:
      - "8083:8083"
      - "9093:9093"
    depends_on:
      user-service:
        condition: service_healthy
      note-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - saas-network

  tenant-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: tenant
    image: saas-tenant:latest
    environment:
      MODULE: tenant
      DATABASE_DSN: postgres://postgres:postgres@postgres:5432/saas?sslmode=disable
      HTTP_ADDR: ":8084"
      GRPC_ADDR: ":9094"
    ports:
      - "8084:8084"
      - "9094:9094"
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - saas-network

  gateway:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      note-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      tenant-service:
        condition: service_healthy
    networks:
      - saas-network

volumes:
  saas_pg_data:

networks:
  saas-network:
    driver: bridge
