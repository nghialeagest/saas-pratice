syntax = "proto3";

package task.v1;

import "google/protobuf/timestamp.proto";

option go_package = "saasbase/modules/task/api;api";

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc CountTasks(CountTasksRequest) returns (CountTasksResponse);
}

message Task {
  string id = 1;
  string title = 2;
  string note_id = 3;
  string note_title = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CreateTaskRequest {
  string title = 1;
  string note_id = 2;
}

message GetTaskRequest { string id = 1; }

message CountTasksRequest {}

message CountTasksResponse { int64 count = 1; }
